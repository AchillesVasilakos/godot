name: Aki ARM Forge
on: [workflow_dispatch]

jobs:
  build-arm64:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Dependencies
        run: |
          sudo apt-get update
          # We only install the bare essentials and the ARM compilers. 
          # No desktop UI headers to avoid the "Multiarch Trap."
          sudo apt-get install -y build-essential scons pkg-config \
            gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Patch Zstd (The Huffman Killer)
        run: |
          # This physically disables the broken x86 assembly loops in the Zstd source
          sed -i 's/ZSTD_ENABLE_ASM_X86_64_BMI2 1/ZSTD_ENABLE_ASM_X86_64_BMI2 0/g' thirdparty/zstd/common/zstd_deps.h || true
          sed -i 's/ZSTD_ENABLE_ASM_X86_64_BMI2 1/ZSTD_ENABLE_ASM_X86_64_BMI2 0/g' thirdparty/zstd/common/portability_macros.h || true

      - name: Compilation
        run: |
          scons platform=linuxbsd arch=arm64 target=template_release precision=double \
            display_server=headless CC=aarch64-linux-gnu-gcc CXX=aarch64-linux-gnu-g++ \
            audio=dummy udev=no fontconfig=no \
            builtin_pcre2=yes builtin_enet=yes builtin_mbedtls=yes builtin_zstd=yes builtin_zlib=yes \
            use_asm=no CCFLAGS="-DZSTD_DISABLE_ASM=1" -j2

      - name: Upload Binary
        uses: actions/upload-artifact@v4
        with:
          name: godot-arm64-server
          path: bin/godot.linuxbsd.template_release.double.arm64
